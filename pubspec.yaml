name: pulso
description: "PULSO — BPM + Sound Meter (Mobile Nativo con TempoCNN & DSP Pro)"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  record: ^5.2.0
  permission_handler: ^11.3.1
  shared_preferences: ^2.2.3
  wakelock_plus: ^1.2.5
  path_provider: ^2.1.3

dependency_overrides:
  record_platform_interface: 1.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/models/
